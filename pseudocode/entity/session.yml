items:
  - name: Session
    type: class
    description: "One conversation held in the app, whatever engine holds it.\nEverything about the conversation except the messages: who ran it, what it\nwas called, where it got to. What ties it to its engine — a transcript on\ndisk, a session on a remote server — is the engine's own and lives in the\nsubclass of that engine, each in a table of its own joined to this one.\nThe root of the hierarchy is what the api, the live topics and the browser\nknow: every kind is a `session` to them, told apart by `engine`, which the\nsubclasses name themselves after — `ClaudeSession` is `claude`."
    properties:
      - name: id
        type: Symfony\Component\Uid\Uuid
      - name: agent
        type: Agent
        nullable: true
        default: null
      - name: agentName
        type: string
      - name: name
        type: string
        nullable: true
        default: null
      - name: model
        type: Model
        nullable: true
        default: null
      - name: turnCount
        type: int
        default: 0
      - name: dateCreated
        type: DateTimeInterface
        nullable: true
        default: null
      - name: dateLastMessage
        type: DateTimeInterface
        nullable: true
        default: null
    methods:
      - type: method
        name: __construct
      - type: method
        name: buildEntityPath
        parameters:
          - type: string
            name: className
        return:
          type: string
      - type: method
        name: getEntityKeyName
        return:
          type: string
      - type: method
        name: getEntityShortName
        return:
          type: string
      - type: method
        name: getId
        return:
          type: Symfony\Component\Uid\Uuid
      - type: method
        name: setId
        parameters:
          - type: Symfony\Component\Uid\Uuid
            name: id
        return:
          type: void
      - type: method
        name: getTableizedName
        return:
          type: string
      - type: method
        name: getCamelName
        return:
          type: string
      - type: method
        name: getAgent
        return:
          type: Agent
      - type: method
        name: setAgent
        parameters:
          - type: Agent
            name: agent
        return:
          type: self
      - type: method
        name: getAgentName
        return:
          type: string
      - type: method
        name: setAgentName
        parameters:
          - type: string
            name: agentName
        return:
          type: self
      - type: method
        name: getName
        return:
          type: string
      - type: method
        name: setName
        parameters:
          - type: string
            name: name
        return:
          type: self
      - type: method
        name: getModel
        return:
          type: Model
      - type: method
        name: setModel
        parameters:
          - type: Model
            name: model
        return:
          type: self
      - type: method
        name: getTurnCount
        return:
          type: int
      - type: method
        name: setTurnCount
        parameters:
          - type: int
            name: turnCount
        return:
          type: self
      - type: method
        name: getDateCreated
        return:
          type: DateTimeInterface
      - type: method
        name: setDateCreated
        parameters:
          - type: DateTimeInterface
            name: dateCreated
        return:
          type: self
      - type: method
        name: getDateLastMessage
        return:
          type: DateTimeInterface
      - type: method
        name: setDateLastMessage
        parameters:
          - type: DateTimeInterface
            name: dateLastMessage
        return:
          type: self
