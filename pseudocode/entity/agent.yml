items:
  - name: Agent
    type: class
    description: "An agent, projected into a record: one an app declares, or one wex ships.\nThe source owns what it says: this record is rebuilt from it and never\nwritten back to it. An app's agent is declared in a file named by its own\nidentity — `<uuid>.json` — so the record takes that uuid, an agent renamed\nor moved stays the same agent, and a declaration that is gone leaves no\nrecord behind. An agent a package ships has no file: wex lists it, with an\nidentity that follows from its qualified name, and it is read only."
    properties:
      - name: description
        type: string
        nullable: true
        default: null
      - name: name
        type: string
        nullable: true
        default: null
      - name: id
        type: Symfony\Component\Uid\Uuid
      - name: path
        type: string
        nullable: true
        default: null
      - name: qualifiedName
        type: string
        nullable: true
        default: null
      - name: model
        type: Model
        nullable: true
        default: null
    methods:
      - type: method
        name: getDescription
        return:
          type: string
      - type: method
        name: setDescription
        parameters:
          - type: string
            name: description
        return:
          type: self
      - type: method
        name: getName
        return:
          type: string
      - type: method
        name: setName
        parameters:
          - type: string
            name: name
        return:
          type: self
      - type: method
        name: setNameFromTitle
        return:
          type: self
      - type: method
        name: buildEntityPath
        parameters:
          - type: string
            name: className
        return:
          type: string
      - type: method
        name: getEntityKeyName
        return:
          type: string
      - type: method
        name: getEntityShortName
        return:
          type: string
      - type: method
        name: getId
        return:
          type: Symfony\Component\Uid\Uuid
      - type: method
        name: setId
        parameters:
          - type: Symfony\Component\Uid\Uuid
            name: id
        return:
          type: void
      - type: method
        name: getTableizedName
        return:
          type: string
      - type: method
        name: getCamelName
        return:
          type: string
      - type: method
        name: __construct
        description: ''
        parameters:
          - type: string
            name: path
            optional: true
            default: null
            description: "the declaration of an app's agent"
          - type: Uuid
            name: id
            optional: true
            default: null
            description: 'the identity wex gives an agent it ships, which has no path'
      - type: method
        name: idFor
        description: 'The identity the declaration is named by, read straight off the file name.'
        parameters:
          - type: string
            name: path
        return:
          type: Uuid
      - type: method
        name: getPath
        return:
          type: string
      - type: method
        name: isBuiltIn
        description: 'Whether a package ships it: then nothing in an app declares it, and nothing here edits it.'
        return:
          type: bool
      - type: method
        name: getQualifiedName
        return:
          type: string
      - type: method
        name: setQualifiedName
        parameters:
          - type: string
            name: qualifiedName
        return:
          type: self
      - type: method
        name: getModel
        return:
          type: Model
      - type: method
        name: setModel
        parameters:
          - type: Model
            name: model
        return:
          type: self
